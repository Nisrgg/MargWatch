version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: margwatch-postgres
    environment:
      POSTGRES_DB: margwatch
      POSTGRES_USER: margwatch
      POSTGRES_PASSWORD: margwatch123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - margwatch-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: margwatch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - margwatch-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: margwatch-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://margwatch:margwatch123@postgres:5432/margwatch?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: margwatch-super-secret-jwt-key-change-this-in-production-2024
      JWT_EXPIRES_IN: 7d
      ML_SERVICE_URL: http://ml-service:5001
      FRONTEND_URL: http://localhost:3000
      MOBILE_URL: http://localhost:3001
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - margwatch-network

  # ML Service
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: margwatch-ml-service
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
      PORT: 5001
    ports:
      - "5001:5001"
    volumes:
      - ./ml-service:/app
    networks:
      - margwatch-network

volumes:
  postgres_data:
  redis_data:

networks:
  margwatch-network:
    driver: bridge
