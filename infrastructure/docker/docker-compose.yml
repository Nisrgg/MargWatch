version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: margwatch-postgres
    environment:
      POSTGRES_DB: margwatch_db
      POSTGRES_USER: margwatch_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-margwatch_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - margwatch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margwatch_user -d margwatch_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: margwatch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - margwatch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API Service
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: margwatch-api
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://margwatch_user:${POSTGRES_PASSWORD:-margwatch_password}@postgres:5432/margwatch_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: http://localhost:3000,http://localhost:8080
    ports:
      - "5000:5000"
    volumes:
      - ./apps/api/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - margwatch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ML Service
  ml-service:
    build:
      context: ./services/ml-service
      dockerfile: Dockerfile
    container_name: margwatch-ml-service
    environment:
      PYTHONUNBUFFERED: 1
      MODEL_PATH: /app/models
      ML_SERVICE_PORT: 8000
      ML_SERVICE_HOST: 0.0.0.0
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./services/ml-service/models:/app/models
    networks:
      - margwatch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Admin Portal (Next.js)
  admin-portal:
    build:
      context: ./apps/admin-portal
      dockerfile: Dockerfile
    container_name: margwatch-admin-portal
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_ML_SERVICE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    networks:
      - margwatch-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: margwatch-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/docker/nginx.conf:/etc/nginx/nginx.conf
      - ./infrastructure/ssl:/etc/nginx/ssl
    depends_on:
      - api
      - ml-service
      - admin-portal
    networks:
      - margwatch-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  margwatch-network:
    driver: bridge
