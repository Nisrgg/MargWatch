  #     - margwatch-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U margwatch_user -d margwatch_db"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: margwatch-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - margwatch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend API Service
  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: margwatch-api
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production}
      JWT_EXPIRES_IN: 24h
      CORS_ORIGIN: http://localhost:3000,http://localhost:8080
      ML_SERVICE_URL: http://ml-service:8000
      ML_MODEL_URL: http://ml-service:8000/predict
      # Cloudinary Configuration (Required for image uploads)
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      # Firebase Configuration (Required for push notifications)
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY_ID: ${FIREBASE_PRIVATE_KEY_ID}
      FIREBASE_CLIENT_ID: ${FIREBASE_CLIENT_ID}
      FIREBASE_AUTH_URI: ${FIREBASE_AUTH_URI}
      FIREBASE_TOKEN_URI: ${FIREBASE_TOKEN_URI}
      FIREBASE_AUTH_PROVIDER_X509_CERT_URL: ${FIREBASE_AUTH_PROVIDER_X509_CERT_URL}
      FIREBASE_CLIENT_X509_CERT_URL: ${FIREBASE_CLIENT_X509_CERT_URL}
      # Google Maps API (Required for geocoding)
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    ports:
      - "5000:5000"
    volumes:
      - ../../apps/api/uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - margwatch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "dist/healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ML Service
  ml-service:
    build:
      context: ../../services/ml-service
      dockerfile: Dockerfile
    container_name: margwatch-ml-service
    environment:
      PYTHONUNBUFFERED: 1
      MODEL_PATH: /app/models
      ML_SERVICE_PORT: 8000
      ML_SERVICE_HOST: 0.0.0.0
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ../../services/ml-service/models:/app/models
    networks:
      - margwatch-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Admin Portal (Next.js)
  admin-portal:
    build:
      context: ../../
      dockerfile: apps/admin-portal/Dockerfile
    container_name: margwatch-admin-portal
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_ML_SERVICE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
      - ml-service
    networks:
      - margwatch-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: margwatch-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ../ssl:/etc/nginx/ssl
    depends_on:
      - api
      - ml-service
      - admin-portal
    networks:
      - margwatch-network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local

networks:
  margwatch-network:
    driver: bridge
