services:
  ml-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: margwatch-ml-pipeline:latest
    container_name: margwatch-ml-pipeline
    volumes:
      # Mount project root for access to all scripts
      - ../..:/workspace:rw
      # Mount outputs directory
      - ./outputs:/app/outputs:rw
      # Mount data directory (for datasets)
      - ./data:/app/data:rw
      # Mount models directory
      - ./models:/app/models:rw
    working_dir: /workspace
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/workspace/services/ml-service
    stdin_open: true
    tty: true
    # Keep container running
    command: tail -f /dev/null
