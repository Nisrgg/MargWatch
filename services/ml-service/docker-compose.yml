version: '3.8'

services:
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/models/road_issue_model.pkl
      - FLASK_ENV=development
      - FLASK_DEBUG=1
    volumes:
      - ./ml-service:/app
      - ./models:/app/models  # Mount models directory if you have trained models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - margwatch-network

networks:
  margwatch-network:
    external: true


